total-budget:
  get:
    tags:
      - User
    summary: Get the total budget of the current user
    description: Retrieve the total_budget field from the User collection.
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Total budget retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/user.schema.yaml#/UserTotalBudget"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Unauthorized
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

  patch:
    tags:
      - User
    summary: Update the total budget of the current user
    description: Update the total_budget field in the User collection.
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/user.schema.yaml#/UserTotalBudget"
    responses:
      "200":
        description: Total budget updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/user.schema.yaml#/UserTotalBudget"
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid total budget value
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Unauthorized
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error
