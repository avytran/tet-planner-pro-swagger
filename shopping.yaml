shopping-items:
  post:
    summary: Create a new shopping item
    tags: [ShoppingItem]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/shopping.schema.yaml#/ShoppingItemRequest"
    responses:
      "201":
        description: Shopping item created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/shopping.schema.yaml#/ShoppingItem"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid shopping item data
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

  get:
    summary: Get all shopping items
    tags: [ShoppingItem]
    description: >
      Retrieve shopping items with filtering by category, timeline, budget, task, due date,
      sorting by date/price/quantity, keyword search, and pagination.
    parameters:
      # Filtering
      - name: category
        in: query
        schema:
          type: string
          example: Food
        description: Filter by item category (Food, Gift, Decoration, Other)
      - name: timeline
        in: query
        schema:
          type: string
          enum: [BeforeTet, Tet30, Mung1, Mung2, Mung3]
        description: Filter by timeline
      - name: budgetId
        in: query
        schema:
          type: string
          format: uuid
        description: Filter by budget ID
      - name: taskId
        in: query
        schema:
          type: string
          format: uuid
        description: Filter by related task ID
      - name: dueDate
        in: query
        schema:
          type: string
          format: date
        description: Filter by due day (YYYY-MM-DD)
      - name: status
        in: query
        schema:
          type: string
          enum: [Planned, Bought, Cancelled]
        description: Filter by shopping item status
      # Search
      - name: keyword
        in: query
        schema:
          type: string
        description: Search by item name keyword
      # Sorting
      - name: sortBy
        in: query
        schema:
          type: string
          enum: [dued_time, price, quantity]
        description: Sort field
      - name: sortOrder
        in: query
        schema:
          type: string
          enum: [asc, desc]
        description: Sort order
      # Pagination
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        description: Number of items per page
    responses:
      "200":
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  type: object
                  properties:
                    page:
                      type: integer
                      example: 1
                    pageSize:
                      type: integer
                      example: 10
                    totalItems:
                      type: integer
                      example: 45
                    totalPages:
                      type: integer
                      example: 5
                    items:
                      type: array
                      items:
                        $ref: "./schemas/shopping.schema.yaml#/ShoppingItem"
      "400":
        description: Invalid query parameters
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid query parameters
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

