budgets:
  post:
    summary: Create a new budget
    tags: [Budget]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/budget.schema.yaml#/BudgetRequest"
    responses:
      "201":
        description: Budget created

  get:
    summary: Get all budgets of the current user
    tags: [Budget]
    responses:
      "200":
        description: List of budgets
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "./schemas/budget.schema.yaml#/Budget"

budgets-id:
  get:
    summary: Get budget details by ID
    tags: [Budget]
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Budget detail
        content:
          application/json:
            schema:
              $ref: "./schemas/budget.schema.yaml#/Budget"

  put:
    summary: Update budget name or budget amount
    tags: [Budget]
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/budget.schema.yaml#/BudgetRequest"
    responses:
      "200":
        description: Budget updated

  delete:
    summary: Delete a budget
    tags: [Budget]
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Budget deleted
