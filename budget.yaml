budgets:
  post:
    summary: Create a new budget
    tags: [Budget]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/budget.schema.yaml#/BudgetRequest"
    responses:
      "201":
        description: Budget created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/budget.schema.yaml#/Budget"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Budget name is required
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

  get:
    summary: Get all budgets of the current user
    tags: [Budget]
    responses:
      "200":
        description: List of budgets
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  type: array
                  items:
                    $ref: "./schemas/budget.schema.yaml#/Budget"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Budget name is required
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

budgets-id:
  get:
    summary: Get budget details by ID with spending summary
    tags: [Budget]
    description: >
      Retrieve budget information by ID. The summary field represents the total spending
      of this budget calculated as SUM(price × quantity) from all shopping items
      belonging to this budgetId.
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
        description: Budget ID
    responses:
      "200":
        description: Budget detail with calculated summary
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/budget.schema.yaml#/Budget"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Budget name is required
      "404":
        description: Budget not found
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Budget not found
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

  put:
    summary: Update budget name or allocated amount
    tags: [Budget]
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/budget.schema.yaml#/BudgetRequest"
    responses:
      "200":
        description: Budget updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/budget.schema.yaml#/Budget"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid budget amount
      "404":
        description: Budget not found
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Budget not found
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

  delete:
    summary: Delete a budget
    tags: [Budget]
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Budget deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  type: object
                  example: { "message": "Budget deleted successfully" }
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Budget name is required
      "404":
        description: Budget not found
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Budget not found
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error
