budgets:
  post:
    summary: Create a new budget
    tags: [Budget]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/budget.schema.yaml#/BudgetRequest"
    responses:
      "201":
        description: Budget created

  get:
    summary: Get all budgets of the current user
    tags: [Budget]
    responses:
      "200":
        description: List of budgets
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "./schemas/budget.schema.yaml#/Budget"

budgets-id:
  get:
    summary: Get budget details by ID with spending summary
    tags: [Budget]
    description: >
      Retrieve budget information by ID. The summary field represents the total spending
      of this budget calculated as SUM(price × quantity) from all shopping items
      belonging to this budgetId
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Budget ID

    responses:
      "200":
        description: Budget detail with calculated summary
        content:
          application/json:
            schema:
              $ref: "./schemas/budget.schema.yaml#/Budget"
      "404":
        description: Budget not found

      "500":
        description: Server error

  put:
    summary: Update budget name or budget amount
    tags: [Budget]
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/budget.schema.yaml#/BudgetRequest"
    responses:
      "200":
        description: Budget updated

  delete:
    summary: Delete a budget
    tags: [Budget]
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Budget deleted
