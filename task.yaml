# Task Endpoints
tasks:
  post:
    summary: Create a new task for the current user
    tags: [Task]
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/task.schema.yaml#/TaskRequest"
    responses:
      "201":
        description: Task created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/task.schema.yaml#/Task"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid task data
      "401":
        description: Invalid refresh token
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid refresh token
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

  get:
    summary: Get all tasks with filtering for the current user
    tags: [Task]
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - in: query
        name: categoryId
        schema:
          type: string
      - in: query
        name: timeline
        schema:
          $ref: "./schemas/task.schema.yaml#/Timeline"
      - in: query
        name: priority
        schema:
          $ref: "./schemas/task.schema.yaml#/Priority"
      - in: query
        name: status
        schema:
          $ref: "./schemas/task.schema.yaml#/Status"
      - in: query
        name: overdue
        schema:
          type: boolean
    responses:
      "200":
        description: List of tasks
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  type: array
                  items:
                    $ref: "./schemas/task.schema.yaml#/Task"
      "401":
        description: Invalid refresh token
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid refresh token
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

