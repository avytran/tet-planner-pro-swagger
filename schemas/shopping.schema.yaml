ShoppingItem:
  type: object
  properties:
    id:
      type: string
    budgetId:
      type: string
    taskId:
      type: string
    name:
      type: string
    quantity:
      type: integer
    price:
      type: number
    timeline:
      $ref: "#/Timeline"
    status:
      $ref: "#/ItemStatus"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ShoppingItemRequest:
  type: object
  required:
    - budgetId
    - taskId
    - name
    - price
    - quantity
    - status
    - timeline
    - duedTime
  properties:
    budgetId:
      type: string
    taskId:
      type: string
    name:
      type: string
    price:
      type: number
    quantity:
      type: integer
    duedTime:
      type: string
      format: date-time
    timeline:
      $ref: "#/Timeline"
    status:
      $ref: "#/ItemStatus"

ShoppingItemPatchRequest:
  type: object
  properties:
    quantity:
      type: integer
    price:
      type: number
    status:
      $ref: "#/ItemStatus"

Timeline:
  type: string
  enum:
    - Pre Tet
    - During Tet
    - After Tet

ItemStatus:
  type: string
  enum:
    - Planning
    - Completed