Budget:
  type: object
  properties:
    id:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    name:
      type: string
    allocatedAmount:
      type: number
      format: double
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    summary:
      type: number
      format: double
      description: Total spent for this budget (SUM(price × quantity))
      example: 2300000

BudgetRequest:
  type: object
  required:
    - name
    - amount
  properties:
    name:
      type: string
    amount:
      type: number
