auth-register:
  post:
    summary: Register a new user account
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/auth.schema.yaml#/RegisterRequest"
    responses:
      "201":
        description: User registered successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/auth.schema.yaml#/UserProfile"
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid request
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

auth-login:
  post:
    summary: User login and return access token
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/auth.schema.yaml#/LoginRequest"
    responses:
      "201":
        description: Login successful
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/auth.schema.yaml#/AuthResponse"
      "401":
        description: Invalid credentials
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid email or password
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

auth-profile:
  get:
    summary: Get current logged-in user information
    tags: [Auth]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: User profile retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/auth.schema.yaml#/UserProfile"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Unauthorized
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error

auth-refresh-token:
  post:
    summary: Refresh access token
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas/auth.schema.yaml#/RefreshTokenRequest"
    responses:
      "201":
        description: Token refreshed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success]
                  example: success
                data:
                  $ref: "./schemas/auth.schema.yaml#/RefreshTokenResponse"
      "401":
        description: Invalid refresh token
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Invalid refresh token
      "500":
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [error]
                  example: error
                message:
                  type: string
                  example: Internal server error
